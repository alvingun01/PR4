syntax = "proto3";

package dfs_service;

service DFSService {

    // 1. REQUIRED (Parts 1 & 2): A method to store files on the server
    //    Client streams the file. The first chunk carries only metadata
    //    (name, client id, checksum, mtime); later chunks carry data.
    //    The caller must hold the write lock for the file.
    rpc StoreFile(stream FileChunk) returns (FileStatus);

    // 2. REQUIRED (Parts 1 & 2): A method to fetch files from the server
    //    The request carries the client's checksum (if it has the file) so the
    //    server can answer ALREADY_EXISTS instead of resending identical data.
    rpc FetchFile(FileRequest) returns (stream FileChunk);

    // 3. REQUIRED (Parts 1 & 2): A method to list all files on the server
    rpc ListFiles(FileRequest) returns (FileList);

    // 4. REQUIRED (Parts 1 & 2): A method to get the status of a file on the server
    rpc GetFileStatus(FileRequest) returns (FileStatus);

    // 5. REQUIRED (Part 2 only): A method to request a write lock from the server
    //    Idempotent for the current holder. RESOURCE_EXHAUSTED if another client holds it.
    rpc RequestWriteLock(FileRequest) returns (WriteLockResponse);

    // 6. REQUIRED (Part 2 only): A method named CallbackList to handle asynchronous file listing requests
    //                            from a client. This method should return a listing of files along with their
    //                            attribute information. The expected attribute information should include name,
    //                            size, and modified time.
    rpc CallbackList(FileRequest) returns (FileList);

    // 7. REQUIRED (Part 2 only): A method to delete a file from the server
    //    The caller must hold the write lock for the file.
    rpc DeleteFile(FileRequest) returns (FileStatus);

}

// Identifies a single file on the server by name (no directories).
message FileRequest {
    string name = 1;
    string client_id = 2;   // requesting client (locks, store/delete ownership)
    uint32 crc = 3;         // client's checksum of its local copy (FetchFile)
    bool has_crc = 4;       // true when `crc` is meaningful (client has a local copy)
}

// One piece of a streamed file transfer.
// For StoreFile the first message carries the metadata fields and no data.
// For FetchFile the first message carries `mtime` (server's modified time).
message FileChunk {
    string name = 1;
    bytes data = 2;
    string client_id = 3;
    uint32 crc = 4;
    int64 mtime = 5;        // seconds since the epoch
}

// Status/attributes of a file on the server.
message FileStatus {
    string name = 1;
    uint64 size = 2;
    int64 mtime = 3;        // seconds since the epoch
    int64 ctime = 4;        // seconds since the epoch
    uint32 crc = 5;
}

// A record that a file was deleted from the server (a "tombstone").
// Lets clients tell "deleted elsewhere" apart from "created locally, not yet stored".
message DeletedFile {
    string name = 1;
    int64 deleted_at = 2;   // server time of the deletion, seconds since the epoch
}

message FileList {
    repeated FileStatus files = 1;
    repeated DeletedFile deleted = 2;
}

message WriteLockResponse {
    string name = 1;
    string holder = 2;      // client id currently holding the lock
}
